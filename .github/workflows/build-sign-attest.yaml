name: Build, Sign & Attest (Matrix)

on:
  push:
    branches: 
      - main
    paths:
      - "backend/**"
      - "client-app/**"
      - ".github/workflows/build-sign-attest.yaml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  packages: write
  attestations: write

env:
  AWS_REGION: eu-central-1

jobs:
  # Stage 1: Build & Push (Per-Service Matrix)
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            ecr_repo: supply-chain-security-dev-backend
            dockerfile: backend/Dockerfile
            context: backend
            source_name: reactivities-backend
          - service: frontend
            ecr_repo: supply-chain-security-dev-frontend
            dockerfile: client-app/Dockerfile
            context: client-app
            source_name: reactivities-frontend
    
    outputs:
      backend-digest: ${{ steps.output.outputs.backend-digest }}
      backend-ref: ${{ steps.output.outputs.backend-ref }}
      frontend-digest: ${{ steps.output.outputs.frontend-digest }}
      frontend-ref: ${{ steps.output.outputs.frontend-ref }}
      registry: ${{ steps.login.outputs.registry }}
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          REGISTRY="${{ steps.login.outputs.registry }}"
          IMAGE_TAG="${GITHUB_SHA::8}-${{ github.run_number }}"
          IMAGE_REF="${REGISTRY}/${{ matrix.ecr_repo }}:${IMAGE_TAG}"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          docker build \
            --build-arg COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_TIMESTAMP="${{ steps.meta.outputs.build_timestamp }}" \
            --build-arg APP_VERSION="1.0.0-${GITHUB_SHA::8}" \
            --tag "${{ steps.meta.outputs.image_ref }}" \
            --file ${{ matrix.dockerfile }} \
            ${{ matrix.context }}

      - name: Push image to ECR
        id: push
        run: |
          docker push "${{ steps.meta.outputs.image_ref }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.meta.outputs.image_ref }}" | cut -d'@' -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Image pushed: ${{ steps.meta.outputs.image_ref }}"
          echo "Digest: ${DIGEST}"

      - name: Verify image exists in registry
        run: |
          aws ecr describe-images \
            --repository-name "${{ matrix.ecr_repo }}" \
            --image-ids imageDigest="${{ steps.push.outputs.digest }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Export outputs for downstream jobs
        id: output
        run: |
          echo "${{ matrix.service }}-digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.service }}-ref=${{ steps.meta.outputs.image_ref }}" >> "$GITHUB_OUTPUT"

      - name: Save image metadata
        run: |
          mkdir -p metadata
          cat > metadata/${{ matrix.service }}.json << EOF
          {
            "service": "${{ matrix.service }}",
            "ecr_repo": "${{ matrix.ecr_repo }}",
            "image_ref": "${{ steps.meta.outputs.image_ref }}",
            "image_digest": "${{ steps.push.outputs.digest }}",
            "registry": "${{ steps.meta.outputs.registry }}",
            "build_timestamp": "${{ steps.meta.outputs.build_timestamp }}"
          }
          EOF

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ matrix.service }}
          path: metadata/${{ matrix.service }}.json
          retention-days: 30

  # Stage 2: Generate SBOMs (Per-Service Matrix)
  sbom:
    name: SBOM ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            ecr_repo: supply-chain-security-dev-backend
            source_name: reactivities-backend
          - service: frontend
            ecr_repo: supply-chain-security-dev-frontend
            source_name: reactivities-frontend
    
    steps:
      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: metadata-${{ matrix.service }}

      - name: Load metadata
        id: meta
        run: |
          IMAGE_REF=$(jq -r '.image_ref' ${{ matrix.service }}.json)
          IMAGE_DIGEST=$(jq -r '.image_digest' ${{ matrix.service }}.json)
          REGISTRY=$(jq -r '.registry' ${{ matrix.service }}.json)
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: "v1.9.0"

      - name: Generate SPDX SBOM
        run: |
          IMAGE="${{ steps.meta.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.meta.outputs.image_digest }}"
          syft "${IMAGE}" \
            --output spdx-json=sbom-spdx.json \
            --source-name "${{ matrix.source_name }}" \
            --source-version "${GITHUB_SHA::8}"
          echo "SPDX SBOM generated:"
          jq '.name, .documentNamespace, (.packages | length)' sbom-spdx.json

      - name: Generate CycloneDX SBOM
        run: |
          IMAGE="${{ steps.meta.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.meta.outputs.image_digest }}"
          syft "${IMAGE}" \
            --output cyclonedx-json=sbom-cyclonedx.json \
            --source-name "${{ matrix.source_name }}" \
            --source-version "${GITHUB_SHA::8}"
          echo "CycloneDX SBOM generated:"
          jq '.bomFormat, .specVersion, (.components | length)' sbom-cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sboms-${{ matrix.service }}
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          retention-days: 30

  # Stage 3: Vulnerability Scan (Per-Service Matrix)
  vuln-scan:
    name: Scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build, sbom]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    
    env:
      GRYPE_DB_AUTO_UPDATE: "true"
      GRYPE_DB_MAX_ALLOWED_BUILT_AGE: "120h"
    
    steps:
      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sboms-${{ matrix.service }}

      - name: Install Grype
        uses: anchore/scan-action/download-grype@v4
        with:
          grype-version: "v0.88.0"

      - name: Update Grype vulnerability database
        run: |
          grype db delete || true
          grype db update
          grype db status

      - name: Scan SPDX SBOM for vulnerabilities
        run: |
          echo "Scanning SPDX SBOM for vulnerabilities..."
          grype sbom:sbom-spdx.json \
            --output table \
            --add-cpes-if-none

          echo "SPDX vulnerability scan passed."

      - name: Scan CycloneDX SBOM for vulnerabilities
        run: |
          echo "Scanning CycloneDX SBOM for vulnerabilities..."
          grype sbom:sbom-cyclonedx.json \
            --output json \
            --add-cpes-if-none > grype-results.json

          echo "CycloneDX vulnerability scan passed."
          
          TOTAL=$(jq '.matches | length' grype-results.json)
          CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' grype-results.json)
          HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' grype-results.json)
          echo "Vulnerability summary: ${TOTAL} total, ${CRITICAL} critical, ${HIGH} high"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-scan-${{ matrix.service }}
          path: grype-results.json
          retention-days: 30

  # Stage 4: Sign Image (Per-Service Matrix)
  sign:
    name: Sign ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build, vuln-scan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            ecr_repo: supply-chain-security-dev-backend
          - service: frontend
            ecr_repo: supply-chain-security-dev-frontend
    
    steps:
      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: metadata-${{ matrix.service }}

      - name: Load metadata
        id: meta
        run: |
          IMAGE_DIGEST=$(jq -r '.image_digest' ${{ matrix.service }}.json)
          REGISTRY=$(jq -r '.registry' ${{ matrix.service }}.json)
          echo "image_digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Sign image with cosign (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          IMAGE="${{ steps.meta.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.meta.outputs.image_digest }}"
          echo "Signing image: ${IMAGE}"
          
          cosign sign "${IMAGE}" \
            --oidc-issuer="https://token.actions.githubusercontent.com" \
            --annotations "repo=${{ github.repository }}" \
            --annotations "workflow=build-sign-attest" \
            --annotations "service=${{ matrix.service }}" \
            --annotations "commit=${{ github.sha }}" \
            --annotations "run_id=${{ github.run_id }}"
          
          echo "Image signed successfully."

      - name: Verify signature
        run: |
          IMAGE="${{ steps.meta.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.meta.outputs.image_digest }}"
          echo "Verifying signature for: ${IMAGE}"
          
          cosign verify "${IMAGE}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" | jq .
          
          echo "Signature verification passed."

  # Stage 5: SBOM Attestation (Per-Service Matrix)
  attest-sbom:
    name: Attest SBOM ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build, sbom, sign]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            ecr_repo: supply-chain-security-dev-backend
          - service: frontend
            ecr_repo: supply-chain-security-dev-frontend
    
    steps:
      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: metadata-${{ matrix.service }}

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sboms-${{ matrix.service }}

      - name: Load metadata
        id: meta
        run: |
          IMAGE_DIGEST=$(jq -r '.image_digest' ${{ matrix.service }}.json)
          REGISTRY=$(jq -r '.registry' ${{ matrix.service }}.json)
          echo "image_digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Attach SPDX SBOM as attestation
        env:
          COSIGN_YES: "true"
        run: |
          IMAGE="${{ steps.meta.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.meta.outputs.image_digest }}"
          
          cosign attest "${IMAGE}" \
            --predicate sbom-spdx.json \
            --type spdxjson \
            --oidc-issuer="https://token.actions.githubusercontent.com"
          
          echo "SPDX SBOM attestation attached."

      - name: Attach CycloneDX SBOM as attestation
        env:
          COSIGN_YES: "true"
        run: |
          IMAGE="${{ steps.meta.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.meta.outputs.image_digest }}"
          
          cosign attest "${IMAGE}" \
            --predicate sbom-cyclonedx.json \
            --type cyclonedx \
            --oidc-issuer="https://token.actions.githubusercontent.com"
          
          echo "CycloneDX SBOM attestation attached."

      - name: Verify SBOM attestations
        run: |
          IMAGE="${{ steps.meta.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.meta.outputs.image_digest }}"
          
          echo "Verifying SPDX attestation..."
          cosign verify-attestation "${IMAGE}" \
            --type spdxjson \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" | jq '.payloadType'
          
          echo "Verifying CycloneDX attestation..."
          cosign verify-attestation "${IMAGE}" \
            --type cyclonedx \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" | jq '.payloadType'
          
          echo "All SBOM attestations verified."

  # Stage 6: SLSA Provenance (Per-Service Matrix)
  provenance:
    name: Provenance ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build, attest-sbom]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            ecr_repo: supply-chain-security-dev-backend
          - service: frontend
            ecr_repo: supply-chain-security-dev-frontend
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: metadata-${{ matrix.service }}

      - name: Load metadata
        id: meta
        run: |
          IMAGE_DIGEST=$(jq -r '.image_digest' ${{ matrix.service }}.json)
          REGISTRY=$(jq -r '.registry' ${{ matrix.service }}.json)
          BUILD_TIMESTAMP=$(jq -r '.build_timestamp' ${{ matrix.service }}.json)
          echo "image_digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Generate SLSA provenance predicate
        run: |
          cat > provenance.json << EOF
          {
            "builder": {
              "id": "https://github.com/actions/runner"
            },
            "buildType": "https://github.com/${{ github.repository }}/build/v1",
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": {
                  "sha1": "${{ github.sha }}"
                },
                "entryPoint": "${{ github.workflow }}"
              },
              "parameters": {
                "service": "${{ matrix.service }}",
                "ecr_repository": "${{ matrix.ecr_repo }}"
              },
              "environment": {
                "github_actor": "${{ github.actor }}",
                "github_event_name": "${{ github.event_name }}",
                "github_run_id": "${{ github.run_id }}",
                "github_run_attempt": "${{ github.run_attempt }}"
              }
            },
            "metadata": {
              "buildInvocationId": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}",
              "buildStartedOn": "${{ steps.meta.outputs.build_timestamp }}",
              "completeness": {
                "parameters": true,
                "environment": true,
                "materials": true
              },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": {
                  "sha1": "${{ github.sha }}"
                }
              }
            ]
          }
          EOF
          
          echo "SLSA provenance predicate generated:"
          jq . provenance.json

      - name: Attest SLSA provenance to image
        env:
          COSIGN_YES: "true"
        run: |
          IMAGE="${{ steps.meta.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.meta.outputs.image_digest }}"
          
          cosign attest "${IMAGE}" \
            --predicate provenance.json \
            --type slsaprovenance \
            --oidc-issuer="https://token.actions.githubusercontent.com"
          
          echo "SLSA provenance attestation attached."

      - name: Verify provenance attestation
        run: |
          IMAGE="${{ steps.meta.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.meta.outputs.image_digest }}"
          
          cosign verify-attestation "${IMAGE}" \
            --type slsaprovenance \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" | jq '.payloadType'
          
          echo "SLSA provenance verification passed."

      - name: Upload provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: slsa-provenance-${{ matrix.service }}
          path: provenance.json
          retention-days: 30

  # Stage 7: Summary
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build, sbom, vuln-scan, sign, attest-sbom, provenance]
    if: always()
    
    steps:
      - name: Download all metadata
        uses: actions/download-artifact@v4
        with:
          pattern: metadata-*
          merge-multiple: true

      - name: Generate pipeline summary
        run: |
          echo "## Supply Chain Security Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Workflow:** Build, Sign & Attest (Matrix)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          B_BUILD="failure" && [ -f "backend.json" ] && B_BUILD="success"
          F_BUILD="failure" && [ -f "frontend.json" ] && F_BUILD="success"
          
          STATUS_SCAN="${{ needs.vuln-scan.result }}"
          STATUS_SIGN="${{ needs.sign.result }}"
          STATUS_ATTEST="${{ needs.attest-sbom.result }}"
          STATUS_PROV="${{ needs.provenance.result }}"
          
          echo "| Stage | Backend | Frontend |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|----------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build & Push | ${B_BUILD} | ${F_BUILD} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SBOM Generation | ${{ needs.sbom.result }} | ${{ needs.sbom.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Vulnerability Scan | ${STATUS_SCAN} | ${STATUS_SCAN} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Signing | ${STATUS_SIGN} | ${STATUS_SIGN} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SBOM Attestation | ${STATUS_ATTEST} | ${STATUS_ATTEST} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SLSA Provenance | ${STATUS_PROV} | ${STATUS_PROV} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          echo "### Service Details" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          for service in backend frontend; do
            if [ -f "${service}.json" ]; then
              echo "#### ${service^}" >> "$GITHUB_STEP_SUMMARY"
              echo "- **ECR Repo:** \`$(jq -r '.ecr_repo' ${service}.json)\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- **Image Ref:** \`$(jq -r '.image_ref' ${service}.json)\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- **Digest:** \`$(jq -r '.image_digest' ${service}.json)\`" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          
          echo "### Pipeline Flow" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Build → SBOM → Scan → Sign → Attest → Provenance" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
