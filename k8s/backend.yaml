apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactivities-backend
  namespace: reactivities
  labels:
    app: backend
    app.kubernetes.io/name: reactivities-backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: reactivities-backend
    spec:
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sql;Database=reactivities;User Id=sa;Password=Password@123;TrustServerCertificate=True"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: TokenKey
              valueFrom:
                secretKeyRef:
                  name: reactivities-secrets
                  key: jwt-key
            - name: JWT__Key
              valueFrom:
                secretKeyRef:
                  name: reactivities-secrets
                  key: jwt-key
            - name: JWT__Issuer
              value: "reactivities"
            - name: JWT__Audience
              value: "reactivities"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "250m"
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: reactivities
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: backend
