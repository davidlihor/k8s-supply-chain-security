{{- if .Values.frontend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.global.projectName }}-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: client-app
          image: "{{ .Values.frontend.image.repository }}@{{ .Values.frontend.image.digest }}"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: IMAGE_DIGEST
              value: "{{ .Values.frontend.image.digest }}"
            - name: SLSA_LEVEL
              value: "SLSA 3"
            - name: IMAGE_SIGNED
              value: "true"
            - name: SBOM_ATTACHED
              value: "true"
            - name: PROVENANCE_ATTACHED
              value: "true"
            - name: API_URL
              value: "http://backend:8080/api"
            - name: CHAT_URL
              value: "http://backend:8080/chat"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: frontend
{{- end }}
