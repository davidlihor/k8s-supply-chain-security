{{- if .Values.sql.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.global.projectName }}-sql
  namespace: {{ .Values.global.namespace }}
  labels:
    app: sql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql
  template:
    metadata:
      labels:
        app: sql
    spec:
      containers:
        - name: sql
          image: "{{ .Values.sql.image.repository }}:{{ .Values.sql.image.tag }}"
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "1"
            - name: MSSQL_SA_PASSWORD
              value: "Password@123"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            readOnlyRootFilesystem: false
          resources:
            {{- toYaml .Values.sql.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sql
  namespace: {{ .Values.global.namespace }}
spec:
  ports:
    - port: 1433
      targetPort: 1433
  selector:
    app: sql
{{- end }}
