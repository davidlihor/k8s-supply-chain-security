{{ if and .Values.kyverno.enabled .Values.kyverno.policies.requireSecurityContext }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-security-context
  annotations:
    policies.kyverno.io/title: Require Security Context Hardening
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Enforces container security best practices: non-root execution,
      no privilege escalation, and all capabilities dropped.
      SQL Server is excluded as it requires root for database engine operations.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Values.global.namespace }}
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app: sql
      validate:
        message: "Containers must run as non-root user (runAsNonRoot: true required)."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true

    - name: deny-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Values.global.namespace }}
      validate:
        message: "Containers must not allow privilege escalation."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false

    - name: drop-all-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Values.global.namespace }}
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app: sql
      validate:
        message: "Containers must drop ALL capabilities."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL
{{ end }}
