{{ if and .Values.kyverno.enabled .Values.kyverno.policies.verifySbomAttestation }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-sbom-attestation
  annotations:
    policies.kyverno.io/title: Verify SBOM Attestation
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verifies that application images have valid CycloneDX SBOM attestations
      signed by GitHub Actions OIDC. SQL Server images are excluded.
spec:
  validationFailureAction: Enforce
  background: true
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-sbom
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Values.global.namespace }}
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app: sql
      verifyImages:
        - imageReferences:
            - "*.dkr.ecr.*.amazonaws.com/supply-chain-security-dev-*"
          attestations:
            - type: https://cyclonedx.org/bom
              attestors:
                - entries:
                    - keyless:
                        issuer: "https://token.actions.githubusercontent.com"
                        subject: "https://github.com/davidlihor/k8s-supply-chain-security/.github/workflows/*"
                        rekor:
                          url: "https://rekor.sigstore.dev"
              conditions:
                - all:
                    - key: '{{ `{{ bomFormat }}` }}'
                      operator: Equals
                      value: "CycloneDX"
                    - key: '{{ `{{ components[0].name }}` }}'
                      operator: NotEquals
                      value: ""
          mutateDigest: true
          verifyDigest: true
          required: true
{{ end }}
