{{ if and .Values.kyverno.enabled .Values.kyverno.policies.verifyImageSignature }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature
  annotations:
    policies.kyverno.io/title: Verify Image Signature (Sigstore Keyless)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verifies that application container images are signed using Sigstore
      cosign with GitHub Actions OIDC identity. Unsigned images are rejected.
      SQL Server images from Microsoft are excluded from this check.
spec:
  validationFailureAction: Enforce
  background: true
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Values.global.namespace }}
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app: sql
      verifyImages:
        - imageReferences:
            - "*.dkr.ecr.*.amazonaws.com/supply-chain-security-dev-*"
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/davidlihor/k8s-supply-chain-security/.github/workflows/*"
                    rekor:
                      url: "https://rekor.sigstore.dev"
          mutateDigest: true
          verifyDigest: true
          required: true
{{ end }}
