{{- if .Values.backend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.global.projectName }}-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: api
          image: "{{ .Values.backend.image.repository }}@{{ .Values.backend.image.digest }}"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sql;Database=reactivities;User Id=sa;Password=Password@123;TrustServerCertificate=True"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: TokenKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.projectName }}-secrets
                  key: jwt-key
            - name: JWT__Key
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.projectName }}-secrets
                  key: jwt-key
            - name: JWT__Issuer
              value: "{{ .Values.global.projectName }}"
            - name: JWT__Audience
              value: "{{ .Values.global.projectName }}"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: backend
{{- end }}
