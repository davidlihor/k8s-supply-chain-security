global:
  namespace: hardened-zone
  projectName: hardened-zone

backend:
  enabled: true
  replicaCount: 2
  image:
    repository: ""
    tag: ""    
    digest: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: ""
    tag: ""
    digest: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

sql:
  enabled: true
  image:
    repository: mcr.microsoft.com/azure-sql-edge
    tag: latest
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "0.5"
      memory: 512Mi

secrets:
  jwtKey: "super_secret_key_for_development_purposes_only_64_characters_long"

kyverno:
  enabled: true
  policies:
    verifyImageSignature: true
    verifySlsaProvenance: true
    verifySbomAttestation: true
    restrictImageRegistries: true
    requireSecurityContext: true
