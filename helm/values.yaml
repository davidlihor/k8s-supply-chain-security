  enabled: true
  replicaCount: 2
  image:
    repository: "405483480335.dkr.ecr.eu-central-1.amazonaws.com/supply-chain-security-dev-frontend"
    tag: "latest"
    digest: "sha256:583e526fa487d66c9d079ea463d0e43af6dcc491e6e647e343db5986cdfb4e22"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
sql:
  enabled: true
  image:
    repository: mcr.microsoft.com/azure-sql-edge
    tag: latest
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "0.5"
      memory: 512Mi
secrets:
  jwtKey: "super_secret_key_for_development_purposes_only_64_characters_long"
kyverno:
  enabled: true
  policies:
    verifyImageSignature: true
    verifySlsaProvenance: true
