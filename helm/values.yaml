  enabled: true
  replicaCount: 2
  image:
    repository: "405483480335.dkr.ecr.eu-central-1.amazonaws.com/supply-chain-security-dev-frontend"
    tag: "latest"
    digest: "sha256:abb16935113dd1c29307ccacde9db3b6e5e80d556d152759f11c29b7ae610cb3"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
sql:
  enabled: true
  image:
    repository: mcr.microsoft.com/azure-sql-edge
    tag: latest
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "0.5"
      memory: 512Mi
