global:
  namespace: hardened-zone
  projectName: hardened-zone
backend:
  enabled: true
  replicaCount: 2
  image:
    repository: "405483480335.dkr.ecr.eu-central-1.amazonaws.com/supply-chain-security-dev-backend"
    tag: "latest"
    digest: "sha256:88bb805b4c42013dfebd88177f9d31d82b41338917d6ae0357a2ebc8653096ed"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: "405483480335.dkr.ecr.eu-central-1.amazonaws.com/supply-chain-security-dev-frontend"
    tag: "latest"
    digest: "sha256:02f4832aba677a04a01cc60678b6649e57986a3ad3d36e905d42caac226d8a00"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
sql:
  enabled: true
  image:
    repository: mcr.microsoft.com/azure-sql-edge
    tag: latest
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "0.5"
      memory: 512Mi
secrets:
  jwtKey: "super_secret_key_for_development_purposes_only_64_characters_long"
kyverno:
  enabled: true
  policies:
    verifyImageSignature: true
    verifySlsaProvenance: true
    verifySbomAttestation: true
    restrictImageRegistries: true
    requireSecurityContext: true
