global:
  namespace: hardened-zone
  projectName: hardened-zone
backend:
  enabled: true
  replicaCount: 2
  image:
    repository: "405483480335.dkr.ecr.eu-central-1.amazonaws.com/supply-chain-security-dev-backend"
    tag: "latest"
    digest: "sha256:cb8d949b308b4eeb0fa9be7cf2caddbe8d220cbc3e98934dc90f874bdc77b29f"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: "405483480335.dkr.ecr.eu-central-1.amazonaws.com/supply-chain-security-dev-frontend"
    tag: "latest"
    digest: "sha256:56a2da84e6335de7df9ddee587ff2649e7f8be54c662c1c00942f2f23b098cd2"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
sql:
  enabled: true
  image:
    repository: mcr.microsoft.com/azure-sql-edge
    tag: latest
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "0.5"
      memory: 512Mi
secrets:
  jwtKey: "super_secret_key_for_development_purposes_only_64_characters_long"
kyverno:
  enabled: true
  policies:
    verifyImageSignature: true
    verifySlsaProvenance: true
    verifySbomAttestation: true
    restrictImageRegistries: true
    requireSecurityContext: true
