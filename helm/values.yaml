global:
  namespace: hardened-zone
  projectName: hardened-zone
backend:
  enabled: true
  replicaCount: 2
  image:
    repository: "405483480335.dkr.ecr.eu-central-1.amazonaws.com/supply-chain-security-dev-backend"
    tag: "latest"
    digest: "sha256:5939551fa29f8e8a452b60c3adf785460a5f8ef3810e8fc601b339cd1c7e989b"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: "405483480335.dkr.ecr.eu-central-1.amazonaws.com/supply-chain-security-dev-frontend"
    tag: "latest"
    digest: "sha256:582bc85c3eed4acc5d9810d8972d4757066199104394d2754cfe2057fc98c665"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
sql:
  enabled: true
  image:
    repository: mcr.microsoft.com/azure-sql-edge
    tag: latest
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "0.5"
      memory: 512Mi
secrets:
  jwtKey: "super_secret_key_for_development_purposes_only_64_characters_long"
kyverno:
  enabled: true
  policies:
    verifyImageSignature: true
    verifySlsaProvenance: true
    verifySbomAttestation: true
    restrictImageRegistries: true
    requireSecurityContext: true
