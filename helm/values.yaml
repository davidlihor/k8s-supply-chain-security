global:
  namespace: hardened-zone
  projectName: hardened-zone
backend:
  enabled: true
  replicaCount: 2
  image:
    repository: "405483480335.dkr.ecr.eu-central-1.amazonaws.com/supply-chain-security-dev-backend"
    tag: "latest"
    digest: "sha256:106ab2b345164cdea0ccb9eaada8c467e45fa34488953caa245fd98ef11815a8"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: "405483480335.dkr.ecr.eu-central-1.amazonaws.com/supply-chain-security-dev-frontend"
    tag: "latest"
    digest: "sha256:342dcee4d2a2838680eda93e014456bef2abbd4e76c0eee5889e2adf16e513e5"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
sql:
  enabled: true
  image:
    repository: mcr.microsoft.com/azure-sql-edge
    tag: latest
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "0.5"
      memory: 512Mi
secrets:
  jwtKey: "super_secret_key_for_development_purposes_only_64_characters_long"
kyverno:
  enabled: true
  policies:
    verifyImageSignature: true
    verifySlsaProvenance: true
    verifySbomAttestation: true
    restrictImageRegistries: true
    requireSecurityContext: true
