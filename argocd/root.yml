apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supply-chain-security-root
  namespace: argocd
spec:
  project: supply-chain-security
  source:
    repoURL: https://github.com/davidlihor/k8s-supply-chain-security.git
    targetRevision: HEAD
    path: argocd/
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
